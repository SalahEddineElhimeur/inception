services :
  mariadb :
    build : ./requirements/mariadb
    container_name : mariadb
    restart: on-failure
    volumes:
      - mariadb:/var/lib/mysql
    networks : 
      - inception
    secrets:
      - db_password
      - db_root_password
    env_file:
      - .env

  wordpress :
    build : ./requirements/wordpress/
    container_name : wordpress
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    networks : 
      - inception
    secrets:
      - wp_admin_password
      - wp_user_password
      - db_password
    env_file:
      - .env
    depends_on:
      - mariadb

  nginx :
    build : ./requirements/nginx/
    container_name : nginx
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    networks : 
      - inception
    secrets:
      - wp_admin_password
      - wp_user_password
      - db_password
    env_file:
      - .env
    depends_on:
      - wordpress
    ports:
      - "443:443"
      
  redis :
    build : ./requirements/bonus/redis/
    container_name : redis
    restart: on-failure
    networks : 
      - inception

  ftp :
    build : ./requirements/ftp/
    container_name : ftp
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    networks : 
      - inception
    secrets:
      - ftp_password
    env_file:
      - .env
    ports:
      - "21:21"
networks:
  inception:
    name: inception
    driver: bridge

volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress


secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/credentials.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file:../secrets/ftp_password.txt