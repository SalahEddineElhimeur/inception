services :
  mariadb :
    build : ./requirements/mariadb
    container_name : mariadb
    restart: on-failure
    volumes:
      - mariadb:/var/lib/mysql
    networks : 
      - inception
    secrets:
      - db_password
      - db_root_password
    env_file:
      - .env

  wordpress :
    build : ./requirements/wordpress/
    container_name : wordpress
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    networks : 
      - inception
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    env_file:
      - .env
    depends_on:
      - mariadb
    ports:
      - "8080:8080"

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data2


secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/credentials.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt